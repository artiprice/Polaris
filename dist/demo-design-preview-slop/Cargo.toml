[package]
name = "polaris"
version = "0.1.0-alpha"
edition = "2024"
description = "Polaris coding-agent terminal UI preview"
license = "MIT"

[[bin]]
name = "polaris"
path = "src/main.rs"

[dependencies]
crossterm = "0.28.1"
ratatui = { version = "0.29.0", features = ["unstable-rendered-line-info"] }
unicode-width = "0.2.0"
unicode-segmentation = "1.13.3"
arboard = "3.7.0"
walkdir = "2.5.0"
globset = "0.4.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["consoleapi", "wincon", "winuser", "synchapi", "winbase"] }

[target.'cfg(windows)'.dev-dependencies]
winapi = { version = "0.3.9", features = ["processthreadsapi", "synchapi", "handleapi", "winbase"] }

[profile.release]
strip = "symbols"

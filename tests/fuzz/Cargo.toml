# cargo-fuzz project (excluded from the root workspace; literal versions, see README.md).
# Run inside WSL2 on nightly:
#   cargo +nightly fuzz run --fuzz-dir tests/fuzz directives_grammar -- -max_total_time=60
[package]
name = "polaris-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4.13"
blake3 = "1.8.7"
polaris-config = { path = "../../crates/polaris-config" }
polaris-kernel-directives = { path = "../../crates/polaris-kernel/crates/directives" }
polaris-storage-cas = { path = "../../crates/polaris-storage/crates/cas" }
polaris-tools-rtk = { path = "../../crates/polaris-tools/crates/rtk" }
polaris-ui-model = { path = "../../crates/polaris-ui/crates/model" }
polaris-security-capability = { path = "../../crates/polaris-security/crates/capability" }
jiff = "0.2.38"
serde_json = "1.0.154"
polaris-storage-eventlog = { path = "../../crates/polaris-storage/crates/eventlog" }
polaris-sdk = { path = "../../crates/polaris-sdk" }
polaris-proto = { path = "../../crates/polaris-proto" }
prost = "0.14.4"
polaris-tools-builtin = { path = "../../crates/polaris-tools/crates/builtin" }
polaris-code-intel = { path = "../../crates/polaris-code-intel" }
polaris-storage-registry = { path = "../../crates/polaris-storage/crates/registry" }
polaris-kernel-bus = { path = "../../crates/polaris-kernel/crates/bus" }
polaris-security-automata = { path = "../../crates/polaris-security/crates/automata" }
polaris-storage-sync = { path = "../../crates/polaris-storage/crates/sync" }
polaris-runtime-leases = { path = "../../crates/polaris-runtime/crates/leases" }
polaris-ext-skills = { path = "../../crates/polaris-ext/crates/skills" }
polaris-tools-math = { path = "../../crates/polaris-tools/crates/math" }


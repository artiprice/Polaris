# =============================================================================
# Polaris workspace — single source of truth
# =============================================================================
# Every workspace package, its layer, parent facade, phase, internal edges and
# planned external dependencies live here. `@prime/tools/workspace.py` generates
# the root Cargo.toml, every member Cargo.toml / src/lib.rs, and checks
# members/layers/versions against this file. Edit this file, then run:
#
#   python -I @prime/tools/workspace.py gen
#
# Layer model (lower may never depend on higher):
#   L0 sdk | L1 foundations | L2 adapters | L3 domain | L4 runtime |
#   L5 composition root + rpc | L6 ui | L7 apps | L8 tests/spikes/xtask
# Edge rule: dep.layer < crate.layer, except facade->child and sibling->sibling
# (same parent) where dep.layer <= crate.layer. A child never depends on its parent.
# Verified versions: crates.io, 2026-10-20 (see PLAN.md §Versions).

[meta]
workspace_version = "0.1.0-alpha"
edition = "2024"
rust_version = "1.99"
openshell_tag = "v0.1.4"
openshell_rev = "5a7728c304b5528e954e9ae900cf21f84e1a12b1"


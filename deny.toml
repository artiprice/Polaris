# cargo-deny policy for Polaris (ADR-001, ADR-014). Run: `cargo deny check`
# Also run against the full planned dependency graph:
#   cargo deny --manifest-path @prime/tools/dep-probe/Cargo.toml check licenses advisories sources

[graph]
all-features = false

[advisories]
# RustSec advisory DB; yanked crates are rejected.
yanked = "deny"
ignore = []

[licenses]
# Permissive licences acceptable for an Apache-2.0 workspace.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]
confidence-threshold = 0.9
# Pending decisions are recorded in PLAN.md ADR-014 (e.g. Slint's licence choice) — add
# explicit exceptions here only after the team decides.
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/NVIDIA/OpenShell"]

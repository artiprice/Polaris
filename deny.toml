# cargo-deny policy for Polaris (ADR-001, ADR-014). Run: `cargo deny check`
# Also run against the full planned dependency graph:
#   cargo deny --manifest-path @prime/tools/dep-probe/Cargo.toml check licenses advisories sources

[graph]
all-features = false

[advisories]
# RustSec advisory DB; yanked crates are rejected.
yanked = "deny"
# Accepted after review (2026-10-29, @prime/SECURITY_REVIEW.md §4). Each entry says why it does not
# apply here; revisit when the upstream crate that pulls it in moves on.
ignore = [
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 timing variability in secret-dependent ops; reached only via biscuit-auth's always-compiled P-256 support, while Polaris creates, signs and parses Ed25519 keys only (token verification touches public data). The fix needs crypto-bigint 0.7, which elliptic-curve 0.13 cannot use." },
    { id = "RUSTSEC-2024-0436", reason = "paste (unmaintained proc macro, compile time only) via leptos/either_of." },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile (unmaintained thin wrapper over rustls-pki-types) via the pinned NVIDIA OpenShell SDK." },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser (unmaintained) via pdf-extract/lopdf and ab_glyph; fonts parsed are local or from ingested PDFs within the ingest limits." },
    { id = "RUSTSEC-2026-0370", reason = "zvariant (unmaintained as a standalone crate) via Slint's accesskit AT-SPI support on Linux." },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names (unmaintained as a standalone crate) via Slint's accesskit AT-SPI support on Linux." },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive (unmaintained as a standalone crate) via Slint's accesskit AT-SPI support on Linux." },
]

[licenses]
# Permissive licences acceptable for an Apache-2.0 workspace.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "NCSA",
]
confidence-threshold = 0.9
# ADR-014 (decided 2026-10-28): Slint is used under its royalty-free desktop licence. Its
# attribution condition is met by the `AboutSlint` widget in the desktop About panel
# (crates/polaris-ui/crates/gui/ui/app.slint). Only the Slint crates may use that licence.
exceptions = [
    { crate = "slint", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "slint-build", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "slint-macros", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-backend-linuxkms", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-backend-selector", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-backend-testing", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-backend-winit", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-common", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-compiler", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-core", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-core-macros", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-renderer-femtovg", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-renderer-skia", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-renderer-software", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal crates are path dependencies (publish = false); they are not wildcard risks.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/NVIDIA/OpenShell"]

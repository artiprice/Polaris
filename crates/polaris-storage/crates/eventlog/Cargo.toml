[package]
autotests = false
name = "polaris-storage-eventlog"
description = "Append-only event journal on redb (events.redb): replay, checkpoints, lease locks and the L2 exact cache."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tokio = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
redb = { workspace = true }
# Internal edges (layer-checked by `cargo xtask check-layers`).
polaris-sdk = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }

# Tests live in the root tests/ tree, mirroring this package's path.

[package]
autotests = false
name = "polaris-storage-cas"
description = "Content-addressable blob store: BLAKE3 ids, zstd compression, xxh3 dirty-checks, short §ref ids."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
blake3 = { workspace = true }
xxhash-rust = { workspace = true }
zstd = { workspace = true }
tempfile = { workspace = true }
bytes = { workspace = true }
# Internal edges (layer-checked by `cargo xtask check-layers`).
polaris-sdk = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
dhat = { workspace = true }

[features]
kani = []

# Tests live in the root tests/ tree, mirroring this package's path.

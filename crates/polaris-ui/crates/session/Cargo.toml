[package]
autotests = false
name = "polaris-ui-session"
description = "Frontend-neutral offline session host over the real local kernel, registry and bounded CAS: open/resume, routed submit, ordered resolved records, kernel-free session queries."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
jiff = { workspace = true }
# Internal edges (layer-checked by `workspace.py check-layers`).
polaris-sdk = { workspace = true }
polaris-kernel = { workspace = true }
polaris-config = { workspace = true }
polaris-runtime = { workspace = true }
polaris-security = { workspace = true }
polaris-system-one = { workspace = true }
polaris-nebius-cloud-token-factory = { workspace = true }
polaris-nebius-cloud = { workspace = true }
polaris-ext = { workspace = true }
polaris-ui-model = { workspace = true }
polaris-rpc = { workspace = true }
polaris-nvidia-docs = { workspace = true }
polaris-hacker = { workspace = true }
polaris-code-intel = { workspace = true }
polaris-devenv = { workspace = true }
polaris-search = { workspace = true }
polaris-ratelimit = { workspace = true }
polaris-openshell = { workspace = true }
polaris-platform = { workspace = true }
blake3 = { workspace = true }
url = { workspace = true }
secrecy = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
# A real daemon for the attach tests (dev only, not a layer edge).
polaris-daemon = { workspace = true }

# Tests live in the root tests/ tree, mirroring this package's path.
[[test]]
name = "chat"
path = "../../../../tests/crates/polaris-ui/crates/session/chat.rs"

[[test]]
name = "open_latency"
path = "../../../../tests/crates/polaris-ui/crates/session/open_latency.rs"

[[test]]
name = "session_host"
path = "../../../../tests/crates/polaris-ui/crates/session/session_host.rs"

[[test]]
name = "ci"
path = "../../../../tests/crates/polaris-ui/crates/session/ci.rs"

[[test]]
name = "hack"
path = "../../../../tests/crates/polaris-ui/crates/session/hack.rs"

[[test]]
name = "local_search"
path = "../../../../tests/crates/polaris-ui/crates/session/local_search.rs"

[[test]]
name = "nvidia"
path = "../../../../tests/crates/polaris-ui/crates/session/nvidia.rs"

[[test]]
name = "remote"
path = "../../../../tests/crates/polaris-ui/crates/session/remote.rs"

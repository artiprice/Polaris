[package]
autotests = false
name = "polaris-ui-model"
description = "Shared UI view models and reducers over the event stream, plus design tokens from the demo (#76B900 accent, palette, typography)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
unicode-segmentation = { workspace = true }
# Internal edges (layer-checked by `cargo xtask check-layers`).
polaris-sdk = { workspace = true }
polaris-kernel-directives = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
insta = { workspace = true, features = ["json"] }
serde_json = { workspace = true }

# Tests live in the root tests/ tree, mirroring this package's path.
[[test]]
name = "cockpit_state"

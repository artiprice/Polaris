[package]
autotests = false
name = "polaris-ui-web"
description = "Local web UI: embedded single-page app, JSON command API and Server-Sent Events over the shared session host."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
getrandom = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# Internal edges (layer-checked by `workspace.py check-layers`).
polaris-sdk = { workspace = true }
polaris-config = { workspace = true }
polaris-ui-session = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
reqwest = { workspace = true }

[[test]]
name = "web_api"
path = "../../../../tests/crates/polaris-ui/crates/web/web_api.rs"

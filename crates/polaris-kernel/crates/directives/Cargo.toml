[package]
autotests = false
name = "polaris-kernel-directives"
description = "Recursive-descent grammar for $directives, /commands and @mentions (nested parentheses, quoted items, effort ranges)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Kani proof harnesses (src/kani_proofs.rs); only `cargo kani --features kani` enables it.
kani = []

[dependencies]
thiserror = { workspace = true }
# Internal edges (layer-checked by `cargo xtask check-layers`).
polaris-sdk = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

# Tests live in the root tests/ tree, mirroring this package's path.
[[test]]
name = "directive_persistence"
path = "../../../../tests/crates/polaris-kernel/crates/directives/directive_persistence.rs"

[[test]]
name = "directive_rendering"
path = "../../../../tests/crates/polaris-kernel/crates/directives/directive_rendering.rs"

[[test]]
name = "input_parser"
path = "../../../../tests/crates/polaris-kernel/crates/directives/input_parser.rs"

[[test]]
name = "load"
path = "../../../../tests/crates/polaris-kernel/crates/directives/load.rs"

[[test]]
name = "mention_parser"
path = "../../../../tests/crates/polaris-kernel/crates/directives/mention_parser.rs"

[[test]]
name = "slash_command_table"
path = "../../../../tests/crates/polaris-kernel/crates/directives/slash_command_table.rs"

[[test]]
name = "subagent_model_ranges"
path = "../../../../tests/crates/polaris-kernel/crates/directives/subagent_model_ranges.rs"

[[test]]
name = "ui_navigation"
path = "../../../../tests/crates/polaris-kernel/crates/directives/ui_navigation.rs"

[package]
autotests = false
name = "polaris-kernel-supervisor"
description = "OTP-style supervision: one-for-one restart, restart intensity limits, circuit breakers, dead-letter queue, worker process pool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
tokio = { workspace = true }
# `rt` provides `TaskTracker`, which proves on shutdown that no supervised task leaks.
tokio-util = { workspace = true, features = ["rt"] }
backon = { workspace = true }
tracing = { workspace = true }
# Internal edges (layer-checked by `cargo xtask check-layers`).
polaris-sdk = { workspace = true }
polaris-log = { workspace = true }
polaris-telemetry = { workspace = true }
polaris-kernel-bus = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# `test-util` gives `start_paused` / `advance`; it is not in the root feature list (flag 8).
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }

# Tests live in the root tests/ tree, mirroring this package's path.
[[test]]
name = "circuit_breaker"
path = "../../../../tests/crates/polaris-kernel/crates/supervisor/circuit_breaker.rs"

[[test]]
name = "dead_letter_queue"
path = "../../../../tests/crates/polaris-kernel/crates/supervisor/dead_letter_queue.rs"

[[test]]
name = "restart_intensity"
path = "../../../../tests/crates/polaris-kernel/crates/supervisor/restart_intensity.rs"

[[test]]
name = "task_supervision"
path = "../../../../tests/crates/polaris-kernel/crates/supervisor/task_supervision.rs"

[[test]]
name = "worker_bootstrap"
path = "../../../../tests/crates/polaris-kernel/crates/supervisor/worker_bootstrap.rs"

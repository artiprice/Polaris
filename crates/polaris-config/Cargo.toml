[package]
autotests = false
name = "polaris-config"
description = "Layered configuration: defaults < ~/.polaris < .polaris < env < session, with provenance, a repo trust filter and secret references."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
etcetera = { workspace = true }
dunce = { workspace = true }
# Internal edges (layer-checked by `cargo xtask check-layers`).
polaris-sdk = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }

# Tests live in the root tests/ tree, mirroring this package's path.
[[test]]
name = "config_cli_preferences"
path = "../../tests/crates/polaris-config/config_cli_preferences.rs"

[[test]]
name = "config_layer_merge"
path = "../../tests/crates/polaris-config/config_layer_merge.rs"

[[test]]
name = "directory_discovery"
path = "../../tests/crates/polaris-config/directory_discovery.rs"

[[test]]
name = "golden_provenance"
path = "../../tests/crates/polaris-config/golden_provenance.rs"

[[test]]
name = "repo_layer_trust_filter"
path = "../../tests/crates/polaris-config/repo_layer_trust_filter.rs"

[[test]]
name = "secret_reference_parsing"
path = "../../tests/crates/polaris-config/secret_reference_parsing.rs"

[package]
name = "polaris-sdk"
description = "Domain newtypes, error kinds, API-registry traits (prompt.md §6.2), the Backends bundle, PlatformOps and command/event contracts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Kani proof harnesses (src/kani_proofs.rs); only `cargo kani --features kani` enables it.
kani = []

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
bytes = { workspace = true, features = ["serde"] }
uuid = { workspace = true }
jiff = { workspace = true, features = ["serde"] }
secrecy = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
insta = { workspace = true, features = ["json"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }

[package]
autotests = false
name = "polaris-sdk"
description = "Domain newtypes, error kinds, API-registry traits (prompt.md §6.2), the Backends bundle, PlatformOps and command/event contracts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Kani proof harnesses (src/kani_proofs.rs); only `cargo kani --features kani` enables it.
kani = []

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
bytes = { workspace = true, features = ["serde"] }
uuid = { workspace = true }
jiff = { workspace = true, features = ["serde"] }
secrecy = { workspace = true }
tokio-util = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
insta = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["rt", "macros"] }

# Tests live in the root tests/ tree, mirroring this package's path.
[[test]]
name = "blast_alert_schema"
path = "../../tests/crates/polaris-sdk/blast_alert_schema.rs"

[[test]]
name = "command_typestate"
path = "../../tests/crates/polaris-sdk/command_typestate.rs"

[[test]]
name = "content_identifiers"
path = "../../tests/crates/polaris-sdk/content_identifiers.rs"

[[test]]
name = "content_store_dispatch"
path = "../../tests/crates/polaris-sdk/content_store_dispatch.rs"

[[test]]
name = "effort_parsing"
path = "../../tests/crates/polaris-sdk/effort_parsing.rs"

[[test]]
name = "event_envelope"
path = "../../tests/crates/polaris-sdk/event_envelope.rs"

[[test]]
name = "human_contract"
path = "../../tests/crates/polaris-sdk/human_contract.rs"

[[test]]
name = "interactive_contract"
path = "../../tests/crates/polaris-sdk/interactive_contract.rs"

[[test]]
name = "probability_validation"
path = "../../tests/crates/polaris-sdk/probability_validation.rs"

[[test]]
name = "prompt_tokenizer"
path = "../../tests/crates/polaris-sdk/prompt_tokenizer.rs"

[[test]]
name = "registry_dispatch"
path = "../../tests/crates/polaris-sdk/registry_dispatch.rs"

[[test]]
name = "secret_source_contract"
path = "../../tests/crates/polaris-sdk/secret_source_contract.rs"


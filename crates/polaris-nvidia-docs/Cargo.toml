[package]
autotests = false
name = "polaris-nvidia-docs"
description = "NVIDIA knowledge engine: docs MCP / llms.txt + .md / HTML ingestion, FTS+vector index, $nvidia(auto) profiles, /nv-profile and /nv-verify advisor packs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
htmd = { workspace = true }
pulldown-cmark = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["time"] }
url = { workspace = true }
# Internal edges (layer-checked by `workspace.py check-layers`).
polaris-sdk = { workspace = true }
polaris-storage-registry = { workspace = true }
polaris-storage-vector = { workspace = true }
polaris-code-intel = { workspace = true }
polaris-ratelimit = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[[test]]
name = "nvidia_knowledge"
path = "../../tests/crates/polaris-nvidia-docs/nvidia_knowledge.rs"

[package]
autotests = false
name = "polaris-browser"
description = "Host-side contract to the in-sandbox browser: navigation/click/type tools, a11y-tree compression, pHash visual diff (/ui-diff)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
blake3 = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Internal edges (layer-checked by `workspace.py check-layers`).
polaris-sdk = { workspace = true }
polaris-proto = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[test]]
name = "browser_contract"
path = "../../tests/crates/polaris-browser/browser_contract.rs"

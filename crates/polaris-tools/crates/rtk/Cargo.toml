[package]
autotests = false
name = "polaris-tools-rtk"
description = "RTK diagnostic engine (port of @prime/tmp/setup rtk-engine): filter compiler/linter streams and keep an atomic issue ledger (.polaris/issues.md)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jiff = { workspace = true }
dunce = { workspace = true }
# Internal edges (layer-checked by `cargo xtask check-layers`).
polaris-sdk = { workspace = true }
polaris-storage-cas = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
insta = { workspace = true }
blake3 = { workspace = true }


[package]
autotests = false
name = "xtask"
description = "Repository automation for Polaris: workspace member and layer checks driven by @prime/tools/workspace.toml."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
blake3 = { workspace = true }
polaris-system-one-schemas = { workspace = true }
polaris-sdk = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# Tests live in the root tests/ tree, mirroring this package's path.
[[test]]
name = "calibration"
path = "../tests/xtask/calibration.rs"

[[test]]
name = "check_layers"
path = "../tests/xtask/check_layers.rs"

[[test]]
name = "check_members"
path = "../tests/xtask/check_members.rs"

[[test]]
name = "check_witness"
path = "../tests/xtask/check_witness.rs"

[[test]]
name = "release_sbom"
path = "../tests/xtask/release_sbom.rs"

[package]
autotests = false
name = "polaris-web"
description = "Axum + Leptos SSR web UI with streaming, per-route lazy loading and a PWA service worker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "polaris_web_app"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "polaris-web"
path = "src/main.rs"
required-features = ["ssr"]

[features]
# Native builds (and `cargo test --workspace`) get the server; cargo-leptos builds the browser
# part with `--no-default-features --features hydrate` for wasm32.
default = ["ssr"]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:leptos_axum",
    "dep:axum",
    "dep:tokio",
    "dep:tower-http",
    "dep:clap",
    "dep:polaris-config",
    "dep:polaris-ui-web",
]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
]

[dependencies]
thiserror = { workspace = true }
leptos = { workspace = true }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Server only.
leptos_axum = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "macros", "signal", "net"] }
tower-http = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
# Browser only.
console_error_panic_hook = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
    "EventSource",
    "MessageEvent",
    "Headers",
    "Location",
    "History",
    "Navigator",
    "Request",
    "RequestInit",
    "Response",
    "ServiceWorkerContainer",
    "Storage",
    "Window",
    "HtmlTextAreaElement",
    "KeyboardEvent",
] }
# Internal edges (layer-checked by `workspace.py check-layers`). The server-side crates are
# optional so the wasm build never pulls the kernel.
polaris-config = { workspace = true, optional = true }
polaris-ui-web = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
reqwest = { workspace = true }

[[test]]
name = "pages"
path = "../../tests/apps/polaris-web/pages.rs"

[package.metadata.leptos]
output-name = "polaris-web"
site-root = "target/site"
site-pkg-dir = "pkg"
site-addr = "127.0.0.1:8788"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
env = "PROD"

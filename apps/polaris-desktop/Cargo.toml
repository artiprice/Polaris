[package]
autotests = false
name = "polaris-desktop"
description = "Native desktop GUI built with Slint (femtovg/software renderer); mobile targets in v2."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "polaris-desktop"
path = "src/main.rs"

[dependencies]
jiff = { workspace = true }
thiserror = { workspace = true }
miette = { workspace = true }
tracing = { workspace = true }
slint = { workspace = true }
tokio = { workspace = true }
rustls = { workspace = true }
# Internal edges (layer-checked by `workspace.py check-layers`).
polaris-ui-gui = { workspace = true }
polaris-ui-session = { workspace = true }
polaris-log = { workspace = true }
polaris-security = { workspace = true }
polaris-sdk = { workspace = true }
polaris-config = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# Tests live in the root tests/ tree, mirroring this package's path.
[[test]]
name = "args"
path = "../../tests/apps/polaris-desktop/args.rs"

[[test]]
name = "bridge"
path = "../../tests/apps/polaris-desktop/bridge.rs"

[[test]]
name = "bridge_chat"
path = "../../tests/apps/polaris-desktop/bridge_chat.rs"

[[test]]
name = "models"
path = "../../tests/apps/polaris-desktop/models.rs"

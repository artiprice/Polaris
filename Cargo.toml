[profile.dev]
opt-level = 0
debug = false
strip = true
incremental = false

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
overflow-checks = true
# Decision D3: unwinding is required for in-process supervision of Rust actors
# (tokio JoinError::Panic); FFI/abort-class failures are isolated in worker processes.
panic = "unwind"
strip = true

# Submission build (P10). Daily release builds may switch to thin LTO (see PLAN.md).
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

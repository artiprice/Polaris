# @generated by @prime/tools/workspace.py from @prime/tools/workspace.toml — edit the table, then regenerate:
#   python -I @prime/tools/workspace.py gen

[workspace]
resolver = "3"
members = [
    "apps/*",
    "crates/*",
    "crates/*/crates/*",
    "tests",
    "tests/spike/*",
    "xtask",
]
exclude = [
    "tests/fuzz",
    "@prime",
    "dist",
    "vendor",
]

[workspace.package]
version = "0.1.0-alpha"
edition = "2024"
rust-version = "1.99"
authors = ["Dmytro Shcherban <dimasahah15@gmail.com>", "Mikhail Melik-Kazarian <artiprice@gmail.com>"]
license = "Apache-2.0"
publish = false

# Intentionally empty (decision D10): the prompt.md lint list is NOT configured in Cargo.toml.
# The table must exist because every member inherits it via `[lints] workspace = true`.
[workspace.lints.rust]
# Production code is safe Rust: no unsafe blocks and no panicking shortcuts. Tests may
# unwrap/expect/panic (clippy.toml); a test that needs unsafe allows it locally.
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

